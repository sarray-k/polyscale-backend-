apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: polyscale-blueprints
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/sarray-k/polyscale-backend-
        revision: HEAD
        directories:
          - path: blueprints/*
  template:
    metadata:
      name: '{{ .path.basename }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/sarray-k/polyscale-backend-
        targetRevision: HEAD
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
