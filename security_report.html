<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>PolyScale Security Report</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; background: #f8fafc; color: #0f172a; }
      h1 { color: #0f172a; }
      .card { background: white; border-radius: 12px; padding: 1.5rem; margin: 1rem 0; box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08); }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #e2e8f0; padding: 0.75rem; text-align: left; }
      th { background: #e2e8f0; }
      .ok { color: #15803d; font-weight: bold; }
      .warn { color: #b45309; font-weight: bold; }
    </style>
  </head>
  <body>
    <h1>Rapport de sécurité PolyScale</h1>
    <div class="card">
      <p>Généré automatiquement à partir des tests de sécurité du projet.</p>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Test</th>
            <th>Statut</th>
            <th>Observations</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>rbac</td><td class="ok">ok</td><td>Exécution vérifiée</td></tr>
          <tr><td>mtls</td><td class="ok">ok</td><td>Exécution vérifiée</td></tr>
          <tr><td>network</td><td class="ok">ok</td><td>Exécution vérifiée</td></tr>
          <tr><td>rate-limit</td><td class="ok">ok</td><td>Exécution vérifiée</td></tr>

      </table>

</html>
