apiVersion: 1
providers:
  - name: 'polyscale'
    orgId: 1
    folder: 'Platform'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards

dashboards:
  - name: kubernetes
    folder: 'Platform'
    type: file
    options:
      path: /etc/grafana/provisioning/dashboards/kubernetes.json
  - name: istio
    folder: 'Platform'
    type: file
    options:
      path: /etc/grafana/provisioning/dashboards/istio.json
  - name: postgresql
    folder: 'Platform'
    type: file
    options:
      path: /etc/grafana/provisioning/dashboards/postgresql.json
  - name: kafka
    folder: 'Platform'
    type: file
    options:
      path: /etc/grafana/provisioning/dashboards/kafka.json
